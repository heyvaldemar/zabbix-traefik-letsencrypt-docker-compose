# Image pins live HERE, as interpolation defaults, so `git pull` (or
# re-downloading this file) delivers the exact version combination this
# repository has tested — no .env editing required. Setting the matching
# variable in .env overrides the default for anyone who wants to pin
# differently; .env itself carries only secrets and deliberate overrides.
# CI (Trivy scans, check-pin-freshness, the ephemeral test .env) reads
# the pins from these lines — this block is the single source of truth.
x-images:
  traefik: &traefik-image ${TRAEFIK_IMAGE_TAG:-traefik:${TRAEFIK_IMAGE_VERSION:-3.7@sha256:9c2a54d87f76f5c2f5f2682c68394af92fb12c0a2686798d6462a3f84bd78eaf}}
  postgres: &postgres-image ${ZABBIX_POSTGRES_IMAGE_TAG:-postgres:${ZABBIX_POSTGRES_IMAGE_VERSION:-15@sha256:9b1d34adbce1dd07ee6e94b4a2cf698884b89bd44a6c9c12f5da8f3acbfe4957}}
  zabbix-server: &zabbix-server-image ${ZABBIX_SERVER_IMAGE_TAG:-zabbix/zabbix-server-pgsql:${ZABBIX_SERVER_IMAGE_VERSION:-7.0.30-ubuntu@sha256:de9b1471dff77298d5a709b89f275fc5b9ba343058d8deee1f55c7ca9830bb0b}}
  zabbix-web: &zabbix-web-image ${ZABBIX_WEB_IMAGE_TAG:-zabbix/zabbix-web-nginx-pgsql:${ZABBIX_WEB_IMAGE_VERSION:-7.0.30-ubuntu@sha256:1e68b65358f6464421f94a6ca627220066a8998d04f6360176b7ef6d984a6031}}
  zabbix-agent: &zabbix-agent-image ${ZABBIX_AGENT_IMAGE_TAG:-zabbix/zabbix-agent2:${ZABBIX_AGENT_IMAGE_VERSION:-7.0.30-ubuntu@sha256:504f4bda39dcd0d1e5b120e61966121d21669cf737348a9a47ae04bd32db9f53}}

networks:
  zabbix-network:
    external: true
  traefik-network:
    external: true

volumes:
  zabbix-postgres:
  zabbix-postgres-backup:
  zabbix-database-backups:
  traefik-certificates:

services:
  postgres:
    image: *postgres-image
    # Hardening: no privilege escalation via setuid binaries
    security_opt:
      - no-new-privileges:true
    # Drop every Linux capability; add back only what this image's
    # entrypoint needs (bind :80/:443, chown its data directory, drop to
    # its service user).
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_READ_SEARCH
      - FOWNER
      - SETGID
      - SETUID
    # Resource limits as .env-overridable defaults (e.g. ZABBIX_POSTGRES_MEMORY_LIMIT=2g);
    # the override survives every git pull.
    # Docker's default is ten seconds, then SIGKILL. That is not always enough
    # for this image to finish shutting down: PostgreSQL has a checkpoint to
    # write, MariaDB has InnoDB to flush, and Redis saves its dataset on the way
    # out. Killed halfway, the next start does crash recovery, and a Redis that
    # held another application's file locks leaves them behind for a person to
    # clear by hand. Sixty seconds, overridable in .env.
    stop_grace_period: ${ZABBIX_POSTGRES_STOP_GRACE_PERIOD:-60s}
    deploy:
      resources:
        limits:
          memory: ${ZABBIX_POSTGRES_MEMORY_LIMIT:-1g}
          cpus: "${ZABBIX_POSTGRES_CPU_LIMIT:-1.0}"
        reservations:
          memory: ${ZABBIX_POSTGRES_MEMORY_RESERVATION:-128m}
          cpus: "${ZABBIX_POSTGRES_CPU_RESERVATION:-0.25}"
    volumes:
      - zabbix-postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${ZABBIX_DB_NAME:-zabbixdb}
      POSTGRES_USER: ${ZABBIX_DB_USER:-zabbixdbuser}
      POSTGRES_PASSWORD: ${ZABBIX_DB_PASSWORD:?set in .env - see .env.example for generation command}
    networks:
      - zabbix-network
    healthcheck:
      test: [ "CMD", "pg_isready", "-q", "-d", "${ZABBIX_DB_NAME:-zabbixdb}", "-U", "${ZABBIX_DB_USER:-zabbixdbuser}" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  zabbix-server:
    image: *zabbix-server-image
    # Hardening: no privilege escalation via setuid binaries
    security_opt:
      - no-new-privileges:true
    # Resource limits as .env-overridable defaults (e.g. ZABBIX_SERVER_MEMORY_LIMIT=2g);
    # the override survives every git pull.
    deploy:
      resources:
        limits:
          memory: ${ZABBIX_SERVER_MEMORY_LIMIT:-1g}
          cpus: "${ZABBIX_SERVER_CPU_LIMIT:-1.0}"
        reservations:
          memory: ${ZABBIX_SERVER_MEMORY_RESERVATION:-128m}
          cpus: "${ZABBIX_SERVER_CPU_RESERVATION:-0.25}"
    environment:
      DB_SERVER_HOST: postgres
      DB_SERVER_PORT: 5432
      POSTGRES_DB: ${ZABBIX_DB_NAME:-zabbixdb}
      POSTGRES_USER: ${ZABBIX_DB_USER:-zabbixdbuser}
      POSTGRES_PASSWORD: ${ZABBIX_DB_PASSWORD}
      ZBX_CACHESIZE: ${ZABBIX_CACHESIZE:-1G}
    networks:
      - zabbix-network
      - traefik-network
    healthcheck:
      test: grep -qr "zabbix_server" /proc/*/status || exit 1
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
    labels:
      # Enable Traefik for this container
      - "traefik.enable=true"
      # Define TCP router rules for Zabbix to match all incoming requests (HostSNI)
      - "traefik.tcp.routers.zabbix-server-tcp.rule=HostSNI(`*`)"
      # Assign the Zabbix TCP router to a named Traefik service
      - "traefik.tcp.routers.zabbix-server-tcp.service=zabbix-server-tcp"
      # Use the 'zabbix-tcp' (custom) entry point
      - "traefik.tcp.routers.zabbix-server-tcp.entrypoints=zabbix-tcp"
      # Define the internal container port for routing to the Zabbix TCP service
      - "traefik.tcp.services.zabbix-server-tcp.loadbalancer.server.port=10051"
      # Assign the Zabbix UDP router to a named Traefik service
      - "traefik.udp.routers.zabbix-server-udp.service=zabbix-server-udp"
      # Use the 'zabbix-udp' (custom) entry point
      - "traefik.udp.routers.zabbix-server-udp.entrypoints=zabbix-udp"
      # Define the internal container port for routing to the Zabbix UDP service
      - "traefik.udp.services.zabbix-server-udp.loadbalancer.server.port=10051"
      # Specify which Docker network Traefik should use for routing
      - "traefik.docker.network=traefik-network"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  zabbix-dashboard:
    image: *zabbix-web-image
    # Hardening: no privilege escalation via setuid binaries
    security_opt:
      - no-new-privileges:true
    # Resource limits as .env-overridable defaults (e.g. ZABBIX_DASHBOARD_MEMORY_LIMIT=2g);
    # the override survives every git pull.
    deploy:
      resources:
        limits:
          memory: ${ZABBIX_DASHBOARD_MEMORY_LIMIT:-512m}
          cpus: "${ZABBIX_DASHBOARD_CPU_LIMIT:-1.0}"
        reservations:
          memory: ${ZABBIX_DASHBOARD_MEMORY_RESERVATION:-64m}
          cpus: "${ZABBIX_DASHBOARD_CPU_RESERVATION:-0.25}"
    environment:
      DB_SERVER_HOST: postgres
      DB_SERVER_PORT: 5432
      POSTGRES_DB: ${ZABBIX_DB_NAME:-zabbixdb}
      POSTGRES_USER: ${ZABBIX_DB_USER:-zabbixdbuser}
      POSTGRES_PASSWORD: ${ZABBIX_DB_PASSWORD}
      ZBX_SERVER_HOST: zabbix-server
      PHP_TZ: ${ZABBIX_TIMEZONE:-UTC}
    networks:
      - zabbix-network
      - traefik-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
    labels:
      # Enable Traefik for this container
      - "traefik.enable=true"
      # Match incoming requests on a specific hostname
      - "traefik.http.routers.zabbix-dashboard.rule=Host(`${ZABBIX_DASHBOARD_HOSTNAME:?set in .env - see .env.example}`)"
      # Assign the router to a named Traefik service
      - "traefik.http.routers.zabbix-dashboard.service=zabbix-dashboard"
      # Use the 'websecure' (HTTPS) entry point
      - "traefik.http.routers.zabbix-dashboard.entrypoints=websecure"
      # Define the internal container port for routing
      - "traefik.http.services.zabbix-dashboard.loadbalancer.server.port=8080"
      # Enable TLS on this router
      - "traefik.http.routers.zabbix-dashboard.tls=true"
      # Use Let's Encrypt for certificate management
      - "traefik.http.routers.zabbix-dashboard.tls.certresolver=letsencrypt"
      # Pass the original Host header to the container
      - "traefik.http.services.zabbix-dashboard.loadbalancer.passhostheader=true"
      # Apply a compression middleware
      - "traefik.http.routers.zabbix-dashboard.middlewares=compresstraefik"
      # Define settings for the compression middleware
      - "traefik.http.middlewares.compresstraefik.compress=true"
      # Specify which Docker network Traefik should use for routing
      - "traefik.docker.network=traefik-network"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      zabbix-server:
        condition: service_healthy
      traefik:
        condition: service_healthy

  zabbix-agent:
    image: *zabbix-agent-image
    # Hardening: no privilege escalation via setuid binaries
    security_opt:
      - no-new-privileges:true
    # Resource limits as .env-overridable defaults (e.g. ZABBIX_AGENT_MEMORY_LIMIT=2g);
    # the override survives every git pull.
    deploy:
      resources:
        limits:
          memory: ${ZABBIX_AGENT_MEMORY_LIMIT:-512m}
          cpus: "${ZABBIX_AGENT_CPU_LIMIT:-1.0}"
        reservations:
          memory: ${ZABBIX_AGENT_MEMORY_RESERVATION:-64m}
          cpus: "${ZABBIX_AGENT_CPU_RESERVATION:-0.25}"
    environment:
      ZBX_HOSTNAME: Zabbix server
      ZBX_SERVER_HOST: zabbix-server
    networks:
      - zabbix-network
    restart: unless-stopped
    depends_on:
      - postgres
      - zabbix-server

  traefik:
    image: *traefik-image
    # Hardening: no privilege escalation via setuid binaries
    security_opt:
      - no-new-privileges:true
    # Drop every Linux capability; add back only what this image's
    # entrypoint needs (bind :80/:443, chown its data directory, drop to
    # its service user).
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    # Resource limits as .env-overridable defaults (e.g. TRAEFIK_MEMORY_LIMIT=2g);
    # the override survives every git pull.
    deploy:
      resources:
        limits:
          memory: ${TRAEFIK_MEMORY_LIMIT:-256m}
          cpus: "${TRAEFIK_CPU_LIMIT:-0.5}"
        reservations:
          memory: ${TRAEFIK_MEMORY_RESERVATION:-64m}
          cpus: "${TRAEFIK_CPU_RESERVATION:-0.1}"
    command:
      # Set the log level (DEBUG, INFO, WARN, ERROR)
      - "--log.level=${TRAEFIK_LOG_LEVEL:-WARN}"
      # Enable the built-in API and web-based dashboard
      - "--api.dashboard=true"
      # Enable the /ping endpoint so we can health-check Traefik
      - "--ping=true"
      # Assign the /ping endpoint to a dedicated entry point on port 8082
      - "--ping.entrypoint=ping"
      - "--entrypoints.ping.address=:8082"
      # Define the primary HTTP entry point on port 80
      - "--entrypoints.web.address=:80"
      # Define the secure (HTTPS) entry point on port 443
      - "--entrypoints.websecure.address=:443"
      # HTTP -> HTTPS redirect at entrypoint level
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      # Define the Zabbix TCP entry point on port 10051
      - "--entryPoints.zabbix-tcp.address=:10051"
      # Define the Zabbix UDP entry point on port 10051
      - "--entryPoints.zabbix-udp.address=:10051/udp"
      # Enable the Docker provider to detect containers and their labels
      - "--providers.docker=true"
      # Point Traefik to the Docker socket
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      # Prevent automatic exposure of all containers; only expose containers
      # with "traefik.enable=true"
      - "--providers.docker.exposedbydefault=false"
      # Use ACME (Let's Encrypt) to generate/renew certificates via TLS challenge
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      # The email address used by Let's Encrypt for renewal notices
      - "--certificatesresolvers.letsencrypt.acme.email=${TRAEFIK_ACME_EMAIL:?set in .env - see .env.example}"
      # The file where ACME certificates are stored inside the container
      - "--certificatesresolvers.letsencrypt.acme.storage=/etc/traefik/acme/acme.json"
      # Enable Prometheus metrics
      - "--metrics.prometheus=true"
      # Configure Prometheus histogram buckets
      - "--metrics.prometheus.buckets=0.1,0.3,1.2,5.0"
      # Check for newer Traefik versions and optionally log that info
      - "--global.checknewversion=true"
      # Disable sending anonymous usage data to the Traefik maintainers
      - "--global.sendanonymoususage=false"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-certificates:/etc/traefik/acme
    networks:
      - traefik-network
    ports:
      - "80:80"
      - "443:443"
      - "10050:10050"
      - "10051:10051"
    healthcheck:
      test: ["CMD", "wget", "http://localhost:8082/ping","--spider"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    labels:
      # Enable Traefik for this container
      - "traefik.enable=true"
      # A router to expose the Traefik dashboard
      - "traefik.http.routers.dashboard.rule=Host(`${TRAEFIK_HOSTNAME:?set in .env - see .env.example}`)"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.tls=true"
      - "traefik.http.routers.dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.routers.dashboard.service=api@internal"
      # Basic Authentication for the Traefik dashboard
      - "traefik.http.routers.dashboard.middlewares=authtraefik"
      - "traefik.http.middlewares.authtraefik.basicauth.users=${TRAEFIK_BASIC_AUTH:?set in .env - see .env.example for htpasswd generation}"
      # Specify the internal server port to the dashboard service
      - "traefik.http.services.dashboard.loadbalancer.server.port=8080"
      # Pass the original Host header to the backend
      - "traefik.http.services.dashboard.loadbalancer.passhostheader=true"
    restart: unless-stopped

  backups:
    image: *postgres-image
    # Hardening: no privilege escalation via setuid binaries
    security_opt:
      - no-new-privileges:true
    # Drop every Linux capability; add back only what this image's
    # entrypoint needs (bind :80/:443, chown its data directory, drop to
    # its service user).
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    # Resource limits as .env-overridable defaults (e.g. ZABBIX_BACKUPS_MEMORY_LIMIT=2g);
    # the override survives every git pull.
    deploy:
      resources:
        limits:
          memory: ${ZABBIX_BACKUPS_MEMORY_LIMIT:-256m}
          cpus: "${ZABBIX_BACKUPS_CPU_LIMIT:-0.5}"
        reservations:
          memory: ${ZABBIX_BACKUPS_MEMORY_RESERVATION:-32m}
          cpus: "${ZABBIX_BACKUPS_CPU_RESERVATION:-0.1}"
    command: >-
      bash -c 'set -o pipefail;
      sleep "$$ZABBIX_BACKUP_INIT_SLEEP";
      while true; do
        STAMP="$$(date +%Y-%m-%d_%H-%M)";
        DB_FILE="$$ZABBIX_POSTGRES_BACKUPS_PATH/$$ZABBIX_POSTGRES_BACKUP_NAME-$$STAMP.gz";
        echo "[$$(date -Iseconds)] Starting database backup to $$DB_FILE";
        if pg_dump -h postgres -p 5432 -d $$ZABBIX_DB_NAME -U $$ZABBIX_DB_USER | gzip > "$$DB_FILE"; then
          echo "[$$(date -Iseconds)] Database backup OK: $$DB_FILE ($$(stat -c %s "$$DB_FILE") bytes)";
        else
          echo "[$$(date -Iseconds)] Database backup FAILED - partial file kept as $$DB_FILE.failed for diagnosis" >&2;
          mv "$$DB_FILE" "$$DB_FILE.failed" 2>/dev/null || true;
        fi;
        if [ "$${ZABBIX_POSTGRES_BACKUP_PRUNE_DAYS:-0}" -ge 1 ]; then
          find "$$ZABBIX_POSTGRES_BACKUPS_PATH" -type f -name "$$ZABBIX_POSTGRES_BACKUP_NAME-*" -mtime "+$$ZABBIX_POSTGRES_BACKUP_PRUNE_DAYS" -delete;
        fi;
        sleep "$$ZABBIX_BACKUP_INTERVAL";
      done'
    volumes:
      - zabbix-postgres-backup:/var/lib/postgresql/data
      - zabbix-database-backups:${ZABBIX_POSTGRES_BACKUPS_PATH:-/srv/zabbix-postgres/backups}
    environment:
      ZABBIX_DB_NAME: ${ZABBIX_DB_NAME:-zabbixdb}
      ZABBIX_DB_USER: ${ZABBIX_DB_USER:-zabbixdbuser}
      PGPASSWORD: ${ZABBIX_DB_PASSWORD}
      ZABBIX_BACKUP_INIT_SLEEP: ${ZABBIX_BACKUP_INIT_SLEEP:-30m}
      ZABBIX_BACKUP_INTERVAL: ${ZABBIX_BACKUP_INTERVAL:-24h}
      ZABBIX_POSTGRES_BACKUP_PRUNE_DAYS: ${ZABBIX_POSTGRES_BACKUP_PRUNE_DAYS:-7}
      ZABBIX_POSTGRES_BACKUPS_PATH: ${ZABBIX_POSTGRES_BACKUPS_PATH:-/srv/zabbix-postgres/backups}
      ZABBIX_POSTGRES_BACKUP_NAME: ${ZABBIX_POSTGRES_BACKUP_NAME:-zabbix-postgres-backup}
    networks:
      - zabbix-network
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
